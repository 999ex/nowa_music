name: 更新と公開

on:
  push:
    branches: [main]
  schedule:
    # 毎日 06:00 JST（UTC 21:00）
    - cron: '0 21 * * *'
    # 毎日 08:00 JST（UTC 23:00）。TuneCore のチャート実績も取りに行く。
    # 週1回（月曜 08:00 JST）に戻すときは '0 23 * * 0'（UTC では日曜 23:00）にし、下の if の値も同じに変える
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      charts_outcome: ${{ steps.charts.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci

      - name: 依存部品のセキュリティ確認
        run: npm audit --audit-level=high

      - name: テスト
        run: npm test

      - name: YouTubeから取得
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: node scripts/fetch-youtube.mjs

      - name: 取得結果が空でないか確認
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('src/data/youtube.json', 'utf8'));
            if (!Array.isArray(data.videos) || data.videos.length === 0) {
              console.log('::error::YouTubeの動画が0件のため、公開を中止しました。GitHubリポジトリの Settings → Secrets and variables → Actions を開き、YOUTUBE_API_KEY と YOUTUBE_CHANNEL_ID が正しく登録されているか確認してください（未登録・打ち間違い・失効が主な原因です）。');
              process.exit(1);
            }
          "

      # 読めなかったときは記録を書き換えずに失敗する。サイトは前回までの記録のまま公開を続け、
      # 最後の「チャート取得の結果を知らせる」で失敗にして、GitHub から通知メールが届くようにする
      - name: TuneCoreからチャート実績を取得
        id: charts
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 23 * * *'
        continue-on-error: true
        run: node scripts/fetch-charts.mjs

      - name: 変更があれば取得結果をコミット
        run: |
          if [ -n "$(git status --porcelain src/data/youtube.json src/data/charts.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/youtube.json src/data/charts.json
            git commit -m "chore: YouTubeとチャート実績のデータを更新"
            git push
          else
            echo "更新なし"
          fi

      - name: ビルド
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # チャート実績の取得に失敗した日は、サイトの公開を済ませたあとでここを失敗にして知らせる
  report:
    needs: [build, deploy]
    if: needs.build.outputs.charts_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::TuneCoreからチャート実績を取得できませんでした。サイトは前回までの記録のまま公開されています。TuneCore のページの形が変わった可能性があるので、build の「TuneCoreからチャート実績を取得」の記録を確認してください。"
          exit 1
